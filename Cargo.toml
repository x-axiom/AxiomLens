[package]
name = "AxiomLens"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
async-channel = "=2.5.0"
gpui-kit = "=0.7.1"
kube = { version = "=4.2.0", features = ["runtime"] }
k8s-openapi = { version = "=0.28.0", features = ["latest"] }
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tempfile = "=3.27.0"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
